<text x="430.0" y="62.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">三條輸入，八條輸出；I2 係最高位，每次只得一個 O 係 1</text>
<polygon points="230.0,136.0 480.0,100.0 480.0,460.0 230.0,424.0" fill="#e8f1fa" stroke="#1e3a5f" stroke-width="2.4"/>
