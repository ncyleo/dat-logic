<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img">
<title>3-to-8 解碼器方塊圖</title>
<desc>I2 I1 I0 輸入，O0 至 O7 輸出</desc>
