<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img">
<title>共陰同共陽七段極性</title>
<desc>共陰輸出 1 段亮；共陽輸出 0 段亮</desc>
<rect width="1080" height="680" fill="#ffffff"/>
