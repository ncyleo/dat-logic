<text x="540.0" y="66.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">同一粒 LED。分別只係公共腳接邊極，所以「亮」對應嘅 0／1 相反。</text>
