<text x="540.0" y="652.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">下面課文嘅表同布林式用「1＝亮」（共陰、高態有效）。接到共陽，要亮嘅段再取反。</text>
