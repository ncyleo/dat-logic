<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img">
<title>D 鎖存：AND、NOT 再入 NOR SR</title>
<desc>上面 AND 出 S＝D·E，入出有上劃線 Q 的 NOR。下面 AND 出 R＝非 D·E，入出 Q 的 NOR。</desc>
<rect width="1120" height="560" fill="#ffffff"/>
<text x="560.0" y="36.0" fill="#1e3a5f" font-size="26" font-weight="700" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">D 鎖存（D-latch）</text>
<text x="560.0" y="62.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">enable（E 或 C）＝1 時 Q 跟 D；＝0 就保持。S＝D·E，R＝（非 D）·E。</text>
<rect x="22" y="86" width="200" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="560.0" y="542.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">E＝0，兩隻 AND 出 0，即 S＝R＝0，保持。E＝1 時 Q 跟 D。</text>
