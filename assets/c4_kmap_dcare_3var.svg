<text x="490.0" y="470.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">唔用 m4 就要寫長啲，例如 z＝AB＋AC。</text>
