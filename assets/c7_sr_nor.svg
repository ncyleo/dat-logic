<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img">
<title>交叉耦合 NOR 的 SR 鎖存</title>
<desc>兩隻 NOR 交叉耦合。R 入出 Q 嗰隻，S 入出有上劃線 Q 嗰隻。00 保持，11 禁止。</desc>
<rect width="1040" height="520" fill="#ffffff"/>
<text x="520.0" y="36.0" fill="#1e3a5f" font-size="26" font-weight="700" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">交叉耦合 NOR 的 SR 鎖存</text>
<text x="520.0" y="62.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">R 入出 Q 嗰隻 NOR；S 入出另一隻。S＝R＝0 保持，S＝R＝1 禁止。</text>
<rect x="28" y="88" width="250" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="520.0" y="502.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">NOR 有一個輸入係 1，輸出就係 0。R＝1 逼 Q＝0；S＝1 逼另一輸出＝0，Q 就變 1。</text>
