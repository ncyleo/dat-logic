<text x="40.0" y="586.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="start" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">接入 OR 的是 O0、O1、O3、O7。其餘輸出不用。</text>
