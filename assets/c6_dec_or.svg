<text x="520.0" y="36.0" fill="#1e3a5f" font-size="26" font-weight="700" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">用 3-to-8 解碼器加 OR 砌函數</text>
<text x="520.0" y="62.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">a＝I2，b＝I1，c＝I0。F＝1 的編號：0、1、3、7。</text>
