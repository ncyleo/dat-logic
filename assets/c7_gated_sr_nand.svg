<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" viewBox="0 0 1020 540" role="img">
<title>四隻 NAND 的 SR 鎖存（有 C）</title>
<desc>C 入左邊兩隻 NAND。C＝0 保持。C＝1 且 S＝R＝1 時兩個輸出都係 1。</desc>
<rect width="1020" height="540" fill="#ffffff"/>
<text x="510.0" y="36.0" fill="#1e3a5f" font-size="26" font-weight="700" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">有 enable（C）的 NAND SR 鎖存</text>
<text x="510.0" y="62.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">四隻 NAND。C＝0 保持；C＝1 且 S＝R＝1 時，Q 同另一輸出都係 1。</text>
<text x="510.0" y="522.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">C＝0：左邊兩隻 NAND 出 1，右邊保持。C＝1、S＝R＝1：Q 同另一輸出都係 1，禁止。</text>
