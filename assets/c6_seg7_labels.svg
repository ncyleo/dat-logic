<polygon points="100.0,28.0 108.0,35.4 108.0,84.6 100.0,92.0 92.0,84.6 92.0,35.4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="100.0,112.0 108.0,119.4 108.0,168.6 100.0,176.0 92.0,168.6 92.0,119.4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="37.4,180.0 82.6,180.0 90.0,188.0 82.6,196.0 37.4,196.0 30.0,188.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="20.0,112.0 28.0,119.4 28.0,168.6 20.0,176.0 12.0,168.6 12.0,119.4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="20.0,28.0 28.0,35.4 28.0,84.6 20.0,92.0 12.0,84.6 12.0,35.4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="37.4,94.0 82.6,94.0 90.0,102.0 82.6,110.0 37.4,110.0 30.0,102.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round"/>
<text x="60.0" y="20.0" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">a</text>
<text x="100.0" y="64.0" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">b</text>
<text x="100.0" y="148.0" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">c</text>
<text x="60.0" y="192.0" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">d</text>
<text x="20.0" y="148.0" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">e</text>
<text x="20.0" y="64.0" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">f</text>
<text x="60.0" y="106.0" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">g</text>
<circle cx="124" cy="192" r="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.6"/>
</g>
<text x="332.0" y="454.0" fill="#94a3b8" font-size="15" font-weight="700" text-anchor="start" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">dp</text>
<rect x="520" y="118" width="360" height="390" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="544" y="142" width="36" height="32" rx="8" fill="#dbeafe"/>
