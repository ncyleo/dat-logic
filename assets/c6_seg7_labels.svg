<rect x="544" y="274" width="36" height="32" rx="8" fill="#dbeafe"/>
<text x="562.0" y="296.0" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">d</text>
<text x="596.0" y="296.0" fill="#1e3a5f" font-size="18" font-weight="700" text-anchor="start" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">底橫</text>
<rect x="544" y="318" width="36" height="32" rx="8" fill="#dbeafe"/>
<text x="562.0" y="340.0" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">e</text>
