<rect x="544" y="362" width="36" height="32" rx="8" fill="#dbeafe"/>
<text x="562.0" y="384.0" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">f</text>
<text x="596.0" y="384.0" fill="#1e3a5f" font-size="18" font-weight="700" text-anchor="start" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">左上豎</text>
<rect x="544" y="406" width="36" height="32" rx="8" fill="#dbeafe"/>
<text x="562.0" y="428.0" fill="#1d4ed8" font-size="16" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">g</text>
<text x="596.0" y="428.0" fill="#1e3a5f" font-size="18" font-weight="700" text-anchor="start" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">中橫</text>
<rect x="544" y="450" width="36" height="32" rx="8" fill="#e2e8f0"/>
<text x="562.0" y="472.0" fill="#64748b" font-size="16" font-weight="800" text-anchor="middle" font-family="JetBrains Mono, DejaVu Sans Mono, ui-monospace, monospace">dp</text>
<text x="596.0" y="472.0" fill="#1e3a5f" font-size="18" font-weight="700" text-anchor="start" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">小數點（本課唔當重點）</text>
<text x="460.0" y="536.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">字母寫喺每一段入面。右下灰點係 dp，本課解碼輸出只計 a–g。</text>
</svg>
