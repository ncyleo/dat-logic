<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img">
<title>七段顯示器標準標籤 a 至 g</title>
<desc>a 頂橫、b 右上、c 右下、d 底橫、e 左下、f 左上、g 中橫；dp 只作附註</desc>
<rect width="920" height="560" fill="#ffffff"/>
<text x="460.0" y="40.0" fill="#1e3a5f" font-size="26" font-weight="700" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">七段顯示器：段 a–g</text>
<text x="460.0" y="68.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">標準標籤。順時針 a → b → c → d → e → f，中間係 g。dp 只係附加。</text>
<g transform="translate(78,96) scale(1.82)">
