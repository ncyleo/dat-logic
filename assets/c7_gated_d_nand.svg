<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" viewBox="0 0 1020 540" role="img">
<title>四隻 NAND 加 NOT 的 D 鎖存（有 C）</title>
<desc>D 入上面 NAND，非 D 入下面，C 做 enable。C＝1 時 Q 跟 D；C＝0 保持。</desc>
<rect width="1020" height="540" fill="#ffffff"/>
<text x="510.0" y="36.0" fill="#1e3a5f" font-size="26" font-weight="700" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">有 enable（C）的 NAND D 鎖存</text>
<text x="510.0" y="62.0" fill="#64748b" font-size="15" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">加一隻 NOT：上面入 D，下面入非 D。C＝1 時 Q 跟 D；C＝0 保持。</text>
<text x="510.0" y="522.0" fill="#64748b" font-size="14" font-weight="500" text-anchor="middle" font-family="WenQuanYi Micro Hei, Microsoft JhengHei, sans-serif">C＝0 保持。C＝1 時 Q 跟 D；因為下面係非 D，兩條資料唔會同時係 1。</text>
